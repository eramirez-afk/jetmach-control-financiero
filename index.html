<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jet Mach · Control Financiero AOC</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',system-ui,sans-serif}.num{font-variant-numeric:tabular-nums}
dialog{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:16px;padding:0;max-width:30rem;width:92vw}
dialog::backdrop{background:rgba(2,6,23,.7)}
input,select{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:.5rem .65rem;width:100%;color:#f1f5f9}
input:focus,select:focus,button:focus-visible{outline:2px solid #38bdf8;outline-offset:1px}
label span{display:block;font-size:.7rem;color:#94a3b8;margin-bottom:.2rem}
@media print{body{background:#fff}header,nav,.noprint,td button{display:none!important}*{color:#000!important;background:transparent!important;border-color:#999!important}}
</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
<header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30">
  <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
    <div><h1 class="text-lg font-bold tracking-tight">Jet Mach <span class="text-sky-400">Control Financiero AOC</span></h1>
      <p class="text-xs text-slate-400">Datos cifrados: cada pestaña se abre solo con su contraseña; la de Jet Mach abre las tres</p></div>
    <div class="flex flex-wrap items-center gap-2 text-sm">
      <span id="estado" class="text-xs mr-1"></span>
      <button id="btnTok" onclick="TOKEN?quitarToken():abrirTok()" class="px-3 py-2 rounded-lg font-semibold"></button>
      <button onclick="bloquearTodo()" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg border border-slate-600">Bloquear todo</button>
    </div>
  </div>
  <nav id="tabs" class="max-w-7xl mx-auto px-4 flex gap-1 overflow-x-auto"></nav>
</header>
<main id="vista" class="max-w-7xl mx-auto px-4 py-6 space-y-6"></main>

<dialog id="dlg"><form onsubmit="guardar(event)" class="p-5 space-y-3">
  <h3 class="font-bold text-lg" id="dlgTitulo">Capturar movimiento</h3><input type="hidden" id="f-id">
  <div class="grid grid-cols-2 gap-3">
    <label><span>Tipo</span><select id="f-tipo"><option value="gasto">Gasto</option><option value="ingreso">Depósito / ingreso</option></select></label>
    <label><span>Fecha</span><input type="date" id="f-fecha" required></label>
    <label><span>Folio / factura</span><input id="f-folio" placeholder="R2930, INV-123…"></label>
    <label><span>Categoría</span><select id="f-cat"><option>Combustible</option><option>Mantenimiento</option><option>Nómina y cargas</option><option>Handling y aeropuerto</option><option>Viáticos y viajes</option><option>Arrendamiento</option><option>Seguros</option><option>Administración</option><option>Entrenamiento</option><option>Comisiones</option><option>Depósito del cliente</option><option>Otros</option></select></label>
  </div>
  <label class="block"><span>Concepto o proveedor</span><input id="f-concepto" required></label>
  <div class="grid grid-cols-2 gap-3">
    <label><span>Moneda</span><select id="f-mon" onchange="calc()"><option>MXN</option><option>USD</option></select></label>
    <label><span>Tipo de cambio (solo USD)</span><input type="number" step="0.0001" id="f-tc" value="18" oninput="calc()"></label>
    <label><span>Importe sin IVA</span><input type="number" step="0.01" id="f-monto" required oninput="calc()"></label>
    <label><span>IVA</span><select id="f-ivap" onchange="calc()"><option value="0.16">16%</option><option value="0">Sin IVA</option></select></label>
  </div>
  <label class="block"><span>Total en MXN con IVA</span><input id="f-total" readonly></label>
  <div class="flex justify-end gap-2 pt-2"><button type="button" onclick="dlg.close()" class="px-3 py-2 rounded-lg bg-slate-700">Cancelar</button><button class="px-4 py-2 rounded-lg bg-sky-600 font-semibold">Guardar movimiento</button></div>
</form></dialog>

<dialog id="dlgTok"><form onsubmit="guardarToken(event)" class="p-5 space-y-3">
  <h3 class="font-bold text-lg">Conectar con GitHub para editar</h3>
  <p class="text-xs text-slate-400">Pega el token del repositorio. Se guarda solo en este navegador. Sin token puedes consultar, pero no capturar.</p>
  <input type="password" id="t-val" autocomplete="off" placeholder="github_pat_…" required>
  <p id="t-msg" class="text-xs text-amber-300 min-h-4"></p>
  <div class="flex justify-end gap-2"><button type="button" onclick="dlgTok.close()" class="px-3 py-2 rounded-lg bg-slate-700">Cancelar</button><button class="px-4 py-2 rounded-lg bg-emerald-700 font-semibold">Conectar</button></div>
</form></dialog>
<div id="toast" class="fixed bottom-5 right-5 bg-slate-700 px-4 py-2 rounded-lg text-sm shadow-lg opacity-0 transition-opacity pointer-events-none"></div>

<script>
const CORTE='2026-08-31',REPO='eramirez-afk/jetmach-control-financiero',BRANCH='main',API=`https://api.github.com/repos/${REPO}/contents/data.json`;
const MESES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const IDS=['inver','red','pasa'],ORDER=[['jet','Jet Mach · Flota'],['inver','Inmobiliaria Inver'],['red','Red Ambiental'],['pasa','PASA']];
const PAL=['#38bdf8','#34d399','#fbbf24','#fb7185','#a78bfa','#f472b6','#2dd4bf','#fb923c','#94a3b8','#818cf8','#4ade80'];
const $=id=>document.getElementById(id),mxn=v=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(v||0);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TAB='jet',STALE={},PLAIN={},KEYS={},charts={},ESTADO='',HORA='',TOKEN=localStorage.getItem('jm_token')||'';
function toast(m){const t=$('toast');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,2600)}

// ===== Cifrado: PBKDF2 (contraseña → llave) + AES-GCM. La contraseña nunca sale del navegador =====
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>{let r='';new Uint8Array(u).forEach(x=>r+=String.fromCharCode(x));return btoa(r)};
const unb64=t=>Uint8Array.from(atob(t.replace(/\n/g,'')),c=>c.charCodeAt(0));
async function derivar(pw,salt){const m=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function abrir(b,pw,key){const salt=unb64(b.s);key=key||await derivar(pw,salt);
  const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(b.i)},key,unb64(b.c));return{plain:JSON.parse(dec.decode(p)),key,salt}}
async function sellar(P,key,salt){const iv=crypto.getRandomValues(new Uint8Array(12));
  return{s:b64(salt),i:b64(iv),c:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(P))))}}

// ===== GitHub: lectura pública, escritura con token (leer → fusionar → escribir) =====
const hdr=()=>({Accept:'application/vnd.github+json',...(TOKEN?{Authorization:'Bearer '+TOKEN}:{})});
async function leerRemoto(){
  const r=await fetch(API+'?ref='+BRANCH+'&t='+Date.now(),{headers:hdr(),cache:'no-store'});
  if(!r.ok)throw new Error('GitHub respondió '+r.status);
  const j=await r.json();return{db:JSON.parse(dec.decode(unb64(j.content))),sha:j.sha};
}
async function sincronizar(id,mut,msg,nk){
  if(!TOKEN){abrirTok();throw new Error('falta conectar el token')}
  for(let i=0;i<3;i++){
    const{db,sha}=await leerRemoto(),K=KEYS[id];let P;
    try{P=(await abrir(id==='jet'?db.jetmach:db.aviones[id],null,K.key)).plain}catch(e){throw new Error('la contraseña cambió: bloquea y vuelve a entrar')}
    mut(P);if(id!=='jet')P.movs=P.movs||[];const use=nk||K,sel=await sellar(P,use.key,use.salt);
    if(id==='jet')db.jetmach=sel;else db.aviones[id]=sel;db.version=3;db.actualizado=new Date().toISOString();
    const body={message:msg,content:b64(enc.encode(JSON.stringify(db,null,1))),branch:BRANCH,sha};
    const r=await fetch(API,{method:'PUT',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.ok){PLAIN[id]=P;KEYS[id]=use;ESTADO='ok';HORA=new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});return}
    if(r.status===401||r.status===403)throw new Error('token vencido o sin permiso de escritura');
  }
  throw new Error('no se pudo guardar tras 3 intentos');
}
async function refrescar(){
  if(!PLAIN[TAB]||dlg.open)return;
  try{const{db}=await leerRemoto();for(const i of TAB==='jet'?IDS:[TAB])if(KEYS[i])PLAIN[i]=(await abrir(db.aviones[i],null,KEYS[i].key)).plain;ESTADO='ok';HORA=new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}
  catch(e){ESTADO='off'}
  render();
}
async function desbloquear(){
  const pw=$('pw').value,m=$('pwMsg');if(!pw)return;m.textContent='Descifrando…';
  try{const{db}=await leerRemoto(),r=await abrir(TAB==='jet'?db.jetmach:db.aviones[TAB],pw);
    PLAIN[TAB]=r.plain;KEYS[TAB]={key:r.key,salt:r.salt};
    if(TAB==='jet'){STALE={};m.textContent='Abriendo los tres aviones…';for(const i of IDS){try{const a=await abrir(db.aviones[i],r.plain.pw[i]);PLAIN[i]=a.plain;KEYS[i]={key:a.key,salt:a.salt}}catch(e){STALE[i]=1}}}
    ESTADO='ok';HORA=new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});render()}
  catch(e){m.textContent=e.name==='OperationError'?'Contraseña incorrecta':'No se pudo leer: '+e.message}
}
function bloquear(id){delete PLAIN[id];delete KEYS[id];render()}
function bloquearTodo(){PLAIN={};KEYS={};render()}

// ===== Token =====
function abrirTok(){$('t-msg').textContent='';dlgTok.showModal()}
function quitarToken(){if(confirm('¿Desconectar este navegador? Quedará en solo lectura.')){TOKEN='';localStorage.removeItem('jm_token');render()}}
async function guardarToken(e){
  e.preventDefault();const t=$('t-val').value.trim(),msg=$('t-msg');msg.textContent='Verificando…';
  try{const r=await fetch('https://api.github.com/repos/'+REPO,{headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+t}});
    if(!r.ok)throw new Error(r.status===401?'Token inválido o vencido':'GitHub respondió '+r.status);
    const j=await r.json();if(!(j.permissions&&j.permissions.push))throw new Error('El token no tiene permiso de escritura (Contents: Read and write)');
    TOKEN=t;localStorage.setItem('jm_token',t);$('t-val').value='';dlgTok.close();render();toast('Conectado: ya puedes capturar')}
  catch(err){msg.textContent=err.message}
}

// ===== Cálculos por avión =====
const ultM=P=>P.meses[P.meses.length-1],ap0=P=>P.aperturaOv!=null?P.aperturaOv:(ultM(P).MXN.cierre||0)+((ultM(P).USD&&ultM(P).USD.cierre)||0)*P.tc;
const eq=(P,i,k)=>{const M=P.meses.find(x=>x.m===i);if(!M)return null;const u=M.USD,f=(B,c)=>B?(B[c]||0):0;return k==='gasto'?f(M.MXN,'total')+f(u,'total')*P.tc:f(M.MXN,'cierre')+f(u,'cierre')*P.tc};
const gastosHist=P=>P.meses.map(M=>eq(P,M.m,'gasto')/(M.nm||1));
const movs=P=>(P.movs||[]).filter(m=>m.fecha>CORTE),suma=(a,t)=>a.filter(m=>m.tipo===t).reduce((s,m)=>s+m.base,0);
function tot(P){const ms=movs(P),ing=suma(ms,'ingreso'),gas=suma(ms,'gasto');return{ing,gas,disp:ap0(P)+ing-gas}}
function serie(P){
  const ms=movs(P);let u=7;ms.forEach(m=>u=Math.max(u,+m.fecha.slice(5,7)-1));const saldo=[],gasto=[];let ac=ap0(P);
  for(let i=0;i<=u;i++){
    if(i<=7){saldo.push(i===7?ap0(P):eq(P,i,'saldo'));gasto.push(eq(P,i,'gasto'));continue}
    const d=ms.filter(m=>+m.fecha.slice(5,7)-1===i),g=suma(d,'gasto');ac+=suma(d,'ingreso')-g;saldo.push(ac);gasto.push(g);
  }
  return{saldo,gasto};
}
function estado(P,d){return d<0?{t:'Sin fondos: saldo por cobrar',c:'text-rose-400',b:'bg-rose-500'}:d<P.umbral?{t:'Por debajo del mínimo',c:'text-amber-400',b:'bg-amber-500'}:{t:'Con fondos',c:'text-emerald-400',b:'bg-emerald-500'}}

// ===== Detalle de lo gastado y lo disponible =====
let SEL='7';
const usd=v=>'US$'+new Intl.NumberFormat('es-MX',{minimumFractionDigits:2}).format(v||0);
const selOk=(P,sel)=>sel==='all'||P.meses.some(M=>String(M.m)===String(sel))?sel:'all';
function periodo(P,sel){
  const r={};P.meses.filter(M=>sel==='all'||String(M.m)===String(sel)).forEach(M=>['MXN','USD'].forEach(c=>{const B=M[c];if(!B)return;
    const R=r[c]=r[c]||{items:[],extras:[],depositos:[],total:0,apertura:B.apertura||0,cierre:0};
    R.items.push(...B.items.map(x=>({...x,etq:M.etq})));R.extras.push(...B.extras.map(x=>({...x,etq:M.etq})));R.depositos.push(...B.depositos.map(x=>({...x,etq:M.etq})));R.total+=B.total||0;R.cierre=B.cierre||0}));
  return r;
}
function catEq(P,sel){const R=periodo(P,sel),o={};['MXN','USD'].forEach(c=>R[c]&&[...R[c].items,...R[c].extras].forEach(x=>o[x.cat]=(o[x.cat]||0)+x.base*(c==='USD'?P.tc:1)));return o}
function chips(list,cur){return '<div class="noprint flex flex-wrap gap-1">'+list.map(o=>`<button onclick="SEL='${o.v}';render()" class="px-3 py-1 rounded-full text-xs border ${String(cur)===String(o.v)?'bg-sky-600 border-sky-500':'border-slate-600 text-slate-300'}">${esc(o.e)}</button>`).join('')+'</div>'}
function detalle(P,sel){
  const R=periodo(P,sel);if(!R.MXN&&!R.USD)return '<p class="text-sm text-slate-500 p-3">Sin datos de este periodo.</p>';
  return ['MXN','USD'].filter(c=>R[c]).map(c=>{
    const B=R[c],f=c==='USD'?usd:mxn,dep=B.depositos.reduce((s,d)=>s+d.base,0),all=[...B.items,...B.extras],cats={};
    all.forEach(x=>{const o=cats[x.cat]=cats[x.cat]||{n:0,t:0};o.n++;o.t+=x.base});const tg=all.reduce((s,x)=>s+x.base,0)||1;
    const ce=(a,v,cl='')=>`<div class="bg-slate-900/60 rounded-xl p-3"><div class="text-[11px] text-slate-400">${a}</div><div class="num font-bold ${cl}">${v}</div></div>`;
    const th='class="p-2 text-left font-normal"',tr='class="border-b border-slate-700/50"';
    return `<div class="space-y-3"><h4 class="font-semibold text-sm">${c==='USD'?'Gastos en dólares (USD)':'Gastos en pesos (MXN)'}</h4>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-2">${ce('Saldo inicial',f(B.apertura))+ce('+ Depósitos (sin IVA)',f(dep),'text-emerald-400')+ce('− Gastado',f(B.total),'text-rose-400')+ce('= Disponible (saldo final)',f(B.cierre),B.cierre<0?'text-rose-400':'text-emerald-400')}</div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div class="overflow-x-auto"><table class="w-full text-sm num"><thead class="text-xs text-slate-400"><tr><th ${th}>Categoría</th><th class="p-2 text-right font-normal">Partidas</th><th class="p-2 text-right font-normal">Gastado</th><th class="p-2 text-right font-normal">%</th></tr></thead><tbody>${Object.entries(cats).sort((a,b)=>b[1].t-a[1].t).map(([k,o])=>`<tr ${tr}><td class="p-2">${esc(k)}<div class="h-1 mt-1 rounded bg-sky-500/70" style="width:${(o.t/tg*100).toFixed(0)}%"></div></td><td class="p-2 text-right">${o.n}</td><td class="p-2 text-right">${f(o.t)}</td><td class="p-2 text-right text-slate-400">${(o.t/tg*100).toFixed(1)}%</td></tr>`).join('')}</tbody></table></div>
      <div class="overflow-x-auto"><table class="w-full text-sm num"><thead class="text-xs text-slate-400"><tr><th ${th}>Depósito / factura</th><th class="p-2 text-right font-normal">Sin IVA</th><th class="p-2 text-right font-normal">IVA</th><th class="p-2 text-right font-normal">Total</th></tr></thead><tbody>${B.depositos.length?B.depositos.map(d=>`<tr ${tr}><td class="p-2">${esc(d.folio)} <span class="text-slate-500 text-xs">${esc(d.etq)}</span></td><td class="p-2 text-right text-emerald-400">${f(d.base)}</td><td class="p-2 text-right text-slate-400">${f(d.iva)}</td><td class="p-2 text-right">${f(d.total)}</td></tr>`).join(''):'<tr><td colspan="4" class="p-3 text-slate-500">Sin depósitos en este periodo.</td></tr>'}</tbody></table></div></div>
    <div class="overflow-x-auto max-h-96 overflow-y-auto border border-slate-700/60 rounded-xl"><table class="w-full text-sm"><thead class="text-xs text-slate-400 sticky top-0 bg-slate-800"><tr><th ${th}>Fecha</th><th ${th}>Concepto / proveedor</th><th ${th}>Folio</th><th ${th}>Categoría</th><th class="p-2 text-right font-normal">Importe</th></tr></thead><tbody>${all.map(x=>`<tr ${tr}><td class="p-2 text-slate-400 whitespace-nowrap">${x.fecha||(x.etq?x.etq+' · cargo del mes':'')}</td><td class="p-2 font-medium">${esc(x.concepto)}</td><td class="p-2 text-slate-400">${esc(x.folio&&x.folio!=='None'?x.folio:'—')}</td><td class="p-2 text-slate-400">${esc(x.cat)}</td><td class="p-2 text-right num">${f(x.base)}</td></tr>`).join('')}</tbody></table></div></div>`;
  }).join('<hr class="border-slate-700 my-4">');
}

// ===== Vista =====
function render(){
  const ok=ESTADO==='ok';
  $('estado').innerHTML=ESTADO?`<span class="${ok?'text-emerald-400':'text-amber-400'}">${ok?'● En línea · '+HORA:'● Sin conexión'}</span> <span class="text-slate-400">· ${TOKEN?'edición activa':'solo lectura'}</span>`:`<span class="text-slate-400">${TOKEN?'edición activa':'solo lectura'}</span>`;
  $('btnTok').textContent=TOKEN?'Desconectar':'Conectar para editar';
  $('btnTok').className=(TOKEN?'bg-slate-700 hover:bg-slate-600 border border-slate-600':'bg-emerald-700 hover:bg-emerald-600')+' px-3 py-2 rounded-lg font-semibold';
  $('tabs').innerHTML=ORDER.map(([id,n])=>`<button onclick="TAB='${id}';render()" class="px-4 py-2.5 text-sm font-semibold whitespace-nowrap border-b-2 ${TAB===id?'border-sky-400 text-white':'border-transparent text-slate-400 hover:text-slate-200'}">${PLAIN[id]?'🔓':'🔒'} ${n}</button>`).join('');
  if(TAB==='jet'&&PLAIN.jet){renderFlota();return}
  const P=PLAIN[TAB];
  if(!P){
    Object.values(charts).forEach(c=>c.destroy());charts={};
    $('vista').innerHTML=`<div class="max-w-sm mx-auto mt-10 bg-slate-800 border border-slate-700 rounded-2xl p-6 space-y-3 text-center"><div class="text-4xl">🔒</div><h2 class="font-bold text-lg">${esc(ORDER.find(o=>o[0]===TAB)[1])}</h2><p class="text-xs text-slate-400">Escribe la contraseña de esta pestaña. Los datos están cifrados y solo se descifran en tu navegador.</p><input type="password" id="pw" autocomplete="off" onkeydown="if(event.key==='Enter')desbloquear()"><p id="pwMsg" class="text-xs text-rose-400 min-h-4"></p><button onclick="desbloquear()" class="w-full bg-sky-600 hover:bg-sky-500 rounded-lg py-2 font-semibold">Entrar</button></div>`;
    setTimeout(()=>$('pw')&&$('pw').focus(),50);return;
  }
  const t=tot(P),e=estado(P,t.disp),h=gastosHist(P),prom=h.length?h.reduce((a,b)=>a+b,0)/h.length:0;
  const aut=t.disp>0&&prom>0?(t.disp/prom).toFixed(1)+' meses':'—',pct=Math.max(0,Math.min(100,P.umbral>0?t.disp/(P.umbral*2)*100:0));
  const k=(a,v,c='text-white')=>`<div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-4"><div class="text-xs text-slate-400">${a}</div><div class="num text-xl font-extrabold mt-1 ${c}">${v}</div></div>`;
  const ms=movs(P).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  $('vista').innerHTML=`
  <section class="rounded-2xl bg-slate-800/80 border border-slate-700 p-5 space-y-3" style="border-top:4px solid ${P.color}">
    <div class="flex flex-wrap justify-between gap-3"><div><h2 class="font-bold text-xl">${esc(P.nombre)}</h2><p class="text-xs text-slate-400">${esc(P.matricula)}${P.modelo?' · '+esc(P.modelo):''}</p></div>

function abrirForm(){
  if(!TOKEN){abrirTok();return}
  $('f-id').value='';$('dlgTitulo').textContent='Capturar movimiento';['f-folio','f-concepto','f-monto'].forEach(i=>$(i).value='');
  $('f-tipo').value='gasto';$('f-mon').value='MXN';$('f-ivap').value='0.16';$('f-tc').value='18';$('f-fecha').value=new Date().toISOString().slice(0,10);calc();dlg.showModal();
}
function calc(){const usd=$('f-mon').value==='USD',tc=usd?(+$('f-tc').value||0):1;$('f-tc').disabled=!usd;$('f-total').value=mxn((+$('f-monto').value||0)*tc*(1+ +$('f-ivap').value))}
async function guardar(e){
  e.preventDefault();const usd=$('f-mon').value==='USD',tc=usd?(+$('f-tc').value||0):1,base=Math.round((+$('f-monto').value||0)*tc*100)/100;
  const m={id:$('f-id').value||'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),tipo:$('f-tipo').value,fecha:$('f-fecha').value,concepto:$('f-concepto').value.trim(),folio:$('f-folio').value.trim(),cat:$('f-cat').value,base,iva:Math.round(base*(+$('f-ivap').value)*100)/100,mon:$('f-mon').value,orig:+$('f-monto').value||0,tc};
  if(m.fecha<=CORTE){toast('La fecha debe ser posterior al corte ('+CORTE+')');return}
  const b=e.submitter;b.disabled=true;b.textContent='Guardando…';
  try{await sincronizar(TAB,P=>{const i=P.movs.findIndex(x=>x.id===m.id);i>=0?P.movs[i]=m:P.movs.push(m)},'Movimiento '+TAB);dlg.close();render();toast('Guardado, cifrado y sincronizado')}
  catch(err){toast('No se guardó: '+err.message)}finally{b.disabled=false;b.textContent='Guardar movimiento'}
}
function editar(id){const m=PLAIN[TAB].movs.find(x=>x.id===id);if(!m)return;abrirForm();if(!TOKEN)return;
  $('dlgTitulo').textContent='Editar movimiento';$('f-id').value=m.id;$('f-tipo').value=m.tipo;$('f-fecha').value=m.fecha;$('f-folio').value=m.folio||'';$('f-concepto').value=m.concepto;$('f-cat').value=m.cat;$('f-mon').value=m.mon||'MXN';$('f-tc').value=m.tc||18;$('f-monto').value=m.orig??m.base;$('f-ivap').value=m.iva>0?'0.16':'0';calc()}
async function borrar(id){if(!TOKEN){abrirTok();return}if(!confirm('¿Borrar este movimiento para todos?'))return;
  try{await sincronizar(TAB,P=>{P.movs=P.movs.filter(x=>x.id!==id)},'Borrar movimiento '+TAB);render();toast('Movimiento borrado')}catch(err){toast('No se borró: '+err.message)}}
async function editarAvion(){
  if(!TOKEN){abrirTok();return}const P=PLAIN[TAB];
  const mat=prompt('Matrícula o modelo:',P.matricula);if(mat===null)return;
  const u=prompt('Mínimo de alerta en MXN:',P.umbral);if(u===null)return;
  const tcv=prompt('Tipo de cambio de referencia USD→MXN (para sumar el saldo en dólares):',P.tc);if(tcv===null)return;
  const ap=prompt('Saldo al corte en MXN (déjalo igual para usar el de los Excel; escribe «reset» para volver al de los Excel):',ap0(P).toFixed(2));if(ap===null)return;
  const rs=ap.trim().toLowerCase()==='reset',n=+ap.replace(/[,$\s]/g,'');if(!rs&&(!isFinite(n)||ap.trim()==='')){toast('Saldo inválido');return}
  try{await sincronizar(TAB,Q=>{Q.matricula=mat.trim()||Q.matricula;Q.umbral=Math.max(0,+u||0);Q.tc=+tcv>0?+tcv:Q.tc;if(rs||Math.abs(n-ap0(P))<0.01&&Q.aperturaOv==null)delete Q.aperturaOv;else Q.aperturaOv=n},'Ajustes '+TAB);render();toast('Ajustes guardados')}catch(err){toast('No se guardó: '+err.message)}
}
async function cambiarClave(){
  if(!TOKEN){abrirTok();return}
  const a=prompt('Nueva contraseña para esta pestaña (mínimo 10 caracteres; usa una frase larga):');if(a===null)return;
  if(a.length<10){toast('Muy corta: mínimo 10 caracteres');return}
  if(prompt('Repite la contraseña:')!==a){toast('No coinciden');return}
  try{const salt=crypto.getRandomValues(new Uint8Array(16));await sincronizar(TAB,()=>{},'Cambio de contraseña '+TAB,{key:await derivar(a,salt),salt});if(TAB!=='jet'&&PLAIN.jet)await sincronizar('jet',J=>{J.pw[TAB]=a},'Actualizar llave maestra');render();toast(TAB!=='jet'&&!PLAIN.jet?'Cambiada. Entra a Jet Mach y usa «Actualizar» para que la vea ahí.':'Contraseña cambiada. Avísale a quien la use.')}catch(err){toast('No se cambió: '+err.message)}
}

  if(!TOKEN){abrirTok();return}
  const pw=prompt('Contraseña actual de '+ORDER.find(o=>o[0]===id)[1]+':');if(!pw)return;
  try{const{db}=await leerRemoto(),r=await abrir(db.aviones[id],pw);await sincronizar('jet',J=>{J.pw[id]=pw},'Actualizar llave maestra');
    PLAIN[id]=r.plain;KEYS[id]={key:r.key,salt:r.salt};delete STALE[id];render();toast('Actualizada')}
  catch(e){toast(e.name==='OperationError'?'Contraseña incorrecta':'No se pudo: '+e.message)}
}

  charts={c1:new Chart($('c1'),{type:'line',data:{labels:lab,datasets:L.map(i=>({label:PLAIN[i].nombre,data:S_[i].saldo,borderColor:PLAIN[i].color,backgroundColor:PLAIN[i].color,tension:.25}))},options:op}),
    c2:new Chart($('c2'),{type:'bar',data:{labels:lab,datasets:L.map(i=>({label:PLAIN[i].nombre,data:S_[i].gasto,backgroundColor:PLAIN[i].color,borderRadius:3}))},options:op})};
}
function exportCSV(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',P=PLAIN[TAB];
  const f=[['Fecha','Tipo','Concepto','Folio','Categoría','Importe sin IVA MXN','IVA MXN']].concat(movs(P).sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(m=>[m.fecha,m.tipo,m.concepto,m.folio,m.cat,m.base,m.iva]));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+f.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));a.download=`jetmach_${TAB}_${new Date().toISOString().slice(0,10)}.csv`;a.click();
}
